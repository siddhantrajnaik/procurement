<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#121212"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="#1E1E1E" stroke="#2A2A2A" stroke-width="4"/>
  <!-- Flask/biotech icon -->
  <g transform="translate(256,240)" fill="none" stroke="#F97316" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flask body -->
    <path d="-60,-120 L-60,-40 L-120,80 Q-130,110 -100,130 L100,130 Q130,110 120,80 L60,-40 L60,-120" fill="#F97316" fill-opacity="0.15"/>
    <line x1="-60" y1="-120" x2="60" y2="-120"/>
    <!-- Liquid line -->
    <path d="-95,60 Q-40,40 0,60 Q40,80 95,60" stroke-width="16" stroke-opacity="0.6"/>
    <!-- Bubbles -->
    <circle cx="-20" cy="20" r="8" fill="#F97316" fill-opacity="0.4" stroke="none"/>
    <circle cx="30" cy="40" r="6" fill="#F97316" fill-opacity="0.3" stroke="none"/>
  </g>
  <!-- MB text -->
  <text x="256" y="440" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="64" fill="#F97316" letter-spacing="8">MB LAB</text>
</svg>
