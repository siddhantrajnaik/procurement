# Keeps the Supabase project awake.
#
# Free-tier projects pause after about a week with no activity. The lab uses the
# app most days, so this only matters over a long break — a vacation, a
# conference, the gap between semesters — which is exactly when nobody is around
# to notice it went to sleep. One cheap read a day is enough to count as
# activity, and public repositories get Actions minutes for free.
#
# Note: GitHub disables scheduled workflows in a repository with no activity for
# 60 days. If both the lab and this repo go quiet that long, this stops too.
# Re-enable it from the Actions tab, or just push anything.

name: Keep Supabase awake

on:
  schedule:
    # 06:00 UTC / 11:30 IST, daily. Seven times more often than strictly needed,
    # because the cost is a second of runner time and the failure is a lab that
    # cannot order anything on a Monday morning.
    - cron: '0 6 * * *'
  workflow_dispatch:

# Nothing here touches the repository.
permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY is not set in repository secrets."
            exit 1
          fi

          # --fail-with-body so a 4xx/5xx is a red run rather than a silent
          # success — a keepalive that stopped working without telling anyone is
          # worse than no keepalive, because it looks like cover.
          status=$(curl --silent --show-error --fail-with-body \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1")

          echo "Supabase answered ${status}."
